name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "e30f3fd0-d9c6-4a94-88a7-325c982537ad"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "a3bfed46f61940ef823440e6ccdaf3ab"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
